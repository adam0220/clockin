  }

  /* ================================================================== */
  /*  ④ 제드의 구출 (Day 18) — 제드가 감염자를 쓰러뜨리며 로비의 제니에게 달려감 */
  /* ================================================================== */
  async function rescue(G) {
    const S = shell('제드의 구출');
    S.hint.textContent = '화면을 누른 채 움직이면 제드가 따라가요. 가까운 감염자는 자동으로 공격해요';
    await card(S, `<div class="m-eyebrow">DAY ${G.day} · MINI GAME</div><h3>제니에게 가는 길</h3>
      <p class="m-sq">로비 안내데스크 뒤에 제니가 갇혔어요. 제드가 정문으로 뛰어들어요</p>
      <ul><li>화면을 누른 채 끌면 <b>제드</b>가 따라가요</li>
      <li>제드는 가까운 감염자를 <b>쇠파이프로 자동 공격</b>해요</li>
      <li>제드의 체력은 ♥4. 감염자에게 닿으면 줄어요</li>
      <li>바리케이드가 무너지기 전에 <b>데스크 앞 감염자를 모두 쓰러뜨리면</b> 구출 성공</li></ul>`, '뛰어들기');

    if (window.__miniAuto) {
      close();
      return { dead: [], effects: { morale: 8 }, trust: { jenny: 2 }, join: ['zed'], note: '(자동) 제드가 제니를 구했어요', log: 'Day 18 제드의 구출', saved: true };
    }

    const jenny = { x: 72, y: 196 };
    const pillars = [{ x: 26, y: 70, w: 10, h: 10 }, { x: 108, y: 70, w: 10, h: 10 }, { x: 26, y: 130, w: 10, h: 10 }, { x: 108, y: 130, w: 10, h: 10 }];
    const desk = { x: 50, y: 174, w: 44, h: 8 };
    const zed = { x: 72, y: 14, hp: 4, inv: 0, cd: 0, swing: 0, moving: false };
    const zs = [], fx = [];
    const add = (x, y, k) => zs.push({ x, y, hp: 2, d: ZLOOK[zs.length % ZLOOK.length], k: zs.length, wt: 0, tx: x, ty: y, hit: 0, jenny: !!k });
    for (let i = 0; i < 12; i++) { let x, y; do { x = rnd(8, 136); y = rnd(40, 150); } while (Math.hypot(x - 72, y - 14) < 40); add(x, y); }
    [16, 44, 72, 100, 128].forEach(x => add(x, 108));   // 가운데를 막아선 무리
    [[52, 166], [72, 164], [92, 166], [62, 156], [82, 156]].forEach(([x, y]) => add(x, y, true));
    MINI._s = { zed, zs, jenny };
    let t = 0, last = performance.now(), raf = 0, ended = false, target = null, bar = 100, spawnT = 0, kills = 0;
    const onDown = e => { e.preventDefault(); target = toWorld(S.cv, e); try { S.cv.setPointerCapture(e.pointerId); } catch (er) {} };
    const onMove = e => { if (target) target = toWorld(S.cv, e); };
    const onUp = () => { target = null; };
    S.cv.addEventListener('pointerdown', onDown); S.cv.addEventListener('pointermove', onMove);
    S.cv.addEventListener('pointerup', onUp); S.cv.addEventListener('pointercancel', onUp);
    const blocked = (x, y) => pillars.some(p => x > p.x - 3 && x < p.x + p.w + 3 && y > p.y && y < p.y + p.h + 4) || (y > desk.y - 1 && x > desk.x - 4 && x < desk.x + desk.w + 4);
    const front = { x: 72, y: desk.y - 4 };   // 데스크 앞 = 제니에게 닿는 자리

    const result = await new Promise(resolve => {
      const finish = why => { if (ended) return; ended = true; cancelAnimationFrame(raf); resolve(why); };
      const loop = now => {
        const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; t += dt;
        // 제드 이동
        zed.moving = false;
        if (target) {
          const dx = target.x - zed.x, dy = target.y - zed.y, d = Math.hypot(dx, dy);
          if (d > 2) {
            const sp = 34 * dt, nx = zed.x + dx / d * Math.min(sp, d), ny = zed.y + dy / d * Math.min(sp, d);
            if (!blocked(nx, zed.y)) zed.x = Math.max(5, Math.min(W - 5, nx));
            if (!blocked(zed.x, ny)) zed.y = Math.max(10, Math.min(H - 4, ny));
            zed.moving = true;
          }
        }
        // 자동 공격
        zed.cd -= dt; zed.swing -= dt; zed.inv -= dt;
        if (zed.cd <= 0) {
          const near = zs.filter(z => z.hp > 0 && dist(z, zed) < 19).sort((a, b) => dist(a, zed) - dist(b, zed))[0];
          if (near) {
            zed.cd = .3; zed.swing = .15; near.hp--; near.hit = .15;
            const d = dist(near, zed) || 1; near.x += (near.x - zed.x) / d * 10; near.y += (near.y - zed.y) / d * 10;
            SFX.thud();
            if (near.hp <= 0) { kills++; blood(fx, near.x, near.y - 8, 10); }
          }
        }
        // 감염자 증원 (정문·양옆)
        spawnT += dt;
        if (spawnT > 2.4) { spawnT = 0; const r = Math.random(); add(r < .4 ? rnd(40, 104) : (r < .7 ? 4 : 140), r < .4 ? 10 : rnd(60, 150)); }
        // 감염자 움직임
        let atJenny = 0;
        for (const z of zs) {
          if (z.hp <= 0) continue;
          z.hit -= dt;
          const dz = dist(z, zed), dj = dist(z, jenny);
          let gx, gy, sp;
          if (dz < 30) { gx = zed.x; gy = zed.y; sp = 12; z.jenny = false; }
          else if (z.jenny || dj < 44) { z.jenny = true; gx = front.x + (z.k % 3 - 1) * 14; gy = front.y; sp = 10; }
          else { z.wt -= dt; if (z.wt <= 0) { z.wt = rnd(1.5, 3); z.tx = rnd(8, 136); z.ty = rnd(30, 165); } gx = z.tx; gy = z.ty; sp = 6; }
          const dx = gx - z.x, dy = gy - z.y, d = Math.hypot(dx, dy);
          if (d > .5) { const nx = z.x + dx / d * Math.min(sp * dt, d), ny = z.y + dy / d * Math.min(sp * dt, d); if (!blocked(nx, ny)) { z.x = nx; z.y = ny; } else z.wt = 0; }
          if (z.jenny && Math.abs(z.y - front.y) < 6 && Math.abs(z.x - front.x) < 26) atJenny++;
          if (dz < 5 && zed.inv <= 0) {
            zed.hp--; zed.inv = 1.5; SFX.growl(); blood(fx, zed.x, zed.y - 8, 10);
            S.cv.classList.remove('m-hit'); void S.cv.offsetWidth; S.cv.classList.add('m-hit');
          }
        }
        for (let i = zs.length - 1; i >= 0; i--) if (zs[i].hp <= 0) zs.splice(i, 1);
        bar = Math.max(0, bar - (1 + atJenny * 1.6) * dt);
        if (zed.hp <= 0) return finish('zed');
        if (bar <= 0) return finish('jenny');
        const guarded = zs.some(z => z.hp > 0 && dist(z, front) < 26);
        if (Math.abs(zed.x - front.x) < 24 && zed.y > front.y - 6 && !guarded) return finish('saved');

        // 그리기
        const g = S.ctx;
        R(g, '#2a2c34', 0, 0, W, H);
        for (let y = 0; y < H; y += 12) for (let x = (y / 12) % 2 ? 0 : 12; x < W; x += 24) R(g, '#30323b', x, y, 12, 12);   // 바닥 타일
        R(g, '#7acfff', 52, 0, 40, 5); txt(g, '정문', 72, 6, '#8d93a6', 7);
        pillars.forEach(p => { R(g, '#4a4c56', p.x, p.y - 12, p.w, p.h + 12); R(g, '#5e606c', p.x, p.y - 12, p.w, 2); });
        R(g, '#6e5a44', desk.x, desk.y, desk.w, desk.h); R(g, '#8a7254', desk.x, desk.y, desk.w, 2);
        txt(g, '안내데스크', 72, desk.y + 10, '#8d93a6', 7);
        const ents = [{ y: jenny.y, j: 1 }, { y: zed.y, me: 1 }, ...zs.map(z => ({ y: z.y, z }))].sort((a, b) => a.y - b.y);
        ents.forEach(e => {
          if (e.j) { ART.drawChar(g, CHARS.jenny, jenny.x, jenny.y, { frame: Math.floor(now / 200), bob: Math.floor(now / 300) % 2 }); }
          else if (e.me) {
            if (zed.inv > 0 && Math.floor(now / 80) % 2) return;
            ART.drawChar(g, CHARS.zed, Math.round(zed.x), Math.round(zed.y), { walk: zed.moving, frame: Math.floor(now / 100) });
            R(g, '#b0b4c0', zed.x + (zed.swing > 0 ? 3 : 5), zed.y - (zed.swing > 0 ? 18 : 12), 2, zed.swing > 0 ? 10 : 8);   // 쇠파이프
          } else {
            ART.drawChar(g, e.z.d, Math.round(e.z.x), Math.round(e.z.y), { zombie: true, walk: true, frame: Math.floor(now / 180) + e.z.k });
            if (e.z.hit > 0) { g.fillStyle = 'rgba(255,255,255,.6)'; g.fillRect(e.z.x - 5, e.z.y - 19, 10, 19); }
          }
        });
        drawFx(g, fx, dt);
        // 제니 바리케이드 막대
        R(g, '#000', 30, 207, 84, 5); R(g, bar > 35 ? '#f2c94c' : '#ff2a3a', 30, 207, 84 * bar / 100, 5);
        txt(g, '♡ 제니', 72, 199, '#ffb0c0', 7);
        S.info.innerHTML = `${'♥'.repeat(zed.hp)}${'♡'.repeat(4 - zed.hp)} · 바리케이드 ${Math.ceil(bar)}% · ☠ ${kills}`;
        raf = requestAnimationFrame(loop);
      };
      raf = requestAnimationFrame(loop);
    });
    MINI._s = null;
    S.cv.removeEventListener('pointerdown', onDown);
    const dead = [];
    if (result === 'zed') {
      dead.push({ id: 'zed', cause: '제니를 구하러 가다 전사', kind: 'fight', last: '제니… 라떼, 다음엔 꼭…' });
      if (bar < 50) dead.push({ id: 'jenny', cause: '로비에 갇혀 습격', kind: 'bite', last: '제드…?' });
    }
    if (result === 'jenny') dead.push({ id: 'jenny', cause: '로비에 갇혀 습격', kind: 'bite', last: '제드, 거의 다 왔는데…' });
    const msg = { saved: ['구출 성공', '제드가 제니에게 닿았어요'], zed: ['제드가 쓰러졌어요', bar < 50 ? '둘 다 돌아오지 못했어요' : '동료들이 뒤늦게 제니를 꺼냈어요'], jenny: ['바리케이드 붕괴', '제드가 한 걸음 늦었어요'] }[result];
    await card(S, `<div class="m-eyebrow">${msg[0]}</div><h3>${msg[1]}</h3>
      <p>쓰러뜨린 감염자 <b class="m-lime">${kills}</b></p>`, '계속');
    close();
    return {
      dead, saved: result === 'saved',
      effects: result === 'saved' ? { morale: 10 } : { morale: -6 },
      trust: result === 'saved' ? { jenny: 2 } : null,
      join: result !== 'zed' ? ['zed'] : null,
      note: result === 'saved' ? `제드가 감염자 ${kills}마리를 쓰러뜨리고 제니를 구했어요` : msg[1],
      log: `Day ${G.day} 제드의 구출`,
    };
  }

  window.MINI = { food, horde, colleagues, rescue };
})();
</script>
<script>/* js/engine.js */
/* 게임 엔진 — 스토리 데이터(story/*.js)를 읽어 하루 단위로 진행합니다
   하루 = 아침 브리핑 → 사건(대사·연출·선택) → 밤(습격·피폭·이탈 판정) → 저녁 결산
   Day 21이 끝나면 엔딩 6종 중 하나로 이어집니다 */
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const cv = $('#scene'), ctx = cv.getContext('2d');
  const { W, H } = ART;
  const SAVE_KEY = 'clockin_apocalypse_save_v2';
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const STATS = [
    { k: 'food',   label: '식량', color: '#f2c94c' },
    { k: 'power',  label: '전력', color: '#56ccf2' },
    { k: 'morale', label: '사기', color: '#6fcf97' },
    { k: 'rad',    label: '피폭', color: '#c86bff', bad: true },
    { k: 'noise',  label: '소음', color: '#ff5a5a', bad: true },
  ];
  const TAGS = {
    death: { icon: '☠', label: '사망',      sfx: 'death' },
    gain:  { icon: '⬆', label: '생존 이득', sfx: 'gain' },
    keep:  { icon: '➖', label: '현상 유지', sfx: 'keep' },
  };
  const LAST_WORDS = {
    zombie:   ['…', '(그르르륵)', '…대, 표…님…'],
    bite:     ['괜찮아요… 진짜 괜찮아요', '내일 회의… 누가 들어가요?', '아프다… 생각보다 훨씬'],
    night:    ['불… 누가 불 켰어요?', '쉿… 쉬잇…', '문, 문 잠갔어요?'],
    fight:    ['이런 데서 죽을 줄은 몰랐네', '…먼저 퇴근할게요'],
    rad:      ['목이… 너무 말라요', '창밖이 예뻐 보여요. 이상하죠'],
    fire:     ['서류는… 놔두고 가요', '뜨거워…!'],
    missing:  ['금방 다녀올게요', '(교신 두절)'],
    gone:     ['미안해요. 더는 못 버티겠어요', '찾지 마세요'],
    starve:   ['라면 냄새가… 나는 것 같아요', '배고프다는 말, 이제 안 할게요'],
    farewell: ['고마웠어요. 진짜로', '저 먼저 퇴근할게요'],
    sacrifice:['다들 출근 잘해요'],
  };

  let G = null;
  let typing = false;
  const scene = { bg: 'office', cast: [], speaker: null, fx: [], runners: [], shakeUntil: 0 };

  /* ================= 상태 ================= */
  function freshState() {
    const s = {
      day: 1,
      stats: { food: 100, power: 70, morale: 65, rad: 5, noise: 10 },
      alive: {}, trust: {}, aff: {}, flags: {}, hidden: ['dante'], joined: [], met: [],
      env: { lights: true, sky: 'day', time: 'day', emergency: false },
      deathsLog: [], log: [], pending: [],
    };
    Object.keys(CHARS).forEach(id => { s.alive[id] = true; s.trust[id] = 5; s.aff[id] = 0; });
    return s;
  }
  const isCore = id => CORE.includes(id);
  function present(g = G) {
    const hid = new Set(g.hidden || []);
    return [...CORE, ...g.joined].filter(id => g.alive[id] && !hid.has(id));
  }
  const survivors = (g = G) => [...CORE, ...g.joined].filter(id => g.alive[id]);
  // Day 1 대탈주 전까지는 회사 전체 인원, 그 뒤로는 생존 인원
  const TOTAL = Object.keys(CHARS).filter(id => CHARS[id].dept !== 'out').length;
  const headLabel = (g = G) => (g.day === 1 && !g.flags.exodus ? `전체 ${TOTAL}명` : `생존 ${survivors(g).length}명`);
  function avgTrust(g = G) {
    const ids = CORE.filter(id => id !== 'rick' && g.alive[id]);
    return ids.length ? ids.reduce((a, id) => a + g.trust[id], 0) / ids.length : 0;
  }
  function victim(g = G, exclude = [], prefer = []) {
    const pool = present(g).filter(id => id !== 'rick' && !exclude.includes(id));
    const pf = prefer.filter(id => pool.includes(id));
    if (pf.length) return pf[0];
    // 무작위가 아니라, 릭을 가장 덜 믿는(= 지금까지의 선택으로 멀어진) 사람이 위험을 떠안음
    return pool.length ? pool.slice().sort((a, b) => g.trust[a] - g.trust[b] || pool.indexOf(a) - pool.indexOf(b))[0] : null;
  }
  const nameOf = id => (id === 'dante_outside' ? '단테' : CHARS[id] ? CHARS[id].name : '');
  const val = v => (typeof v === 'function' ? v(G) : v);
  // {inf} {v} {dead} 처럼 플래그에 든 캐릭터 id를 이름으로 바꿔 줌
  // {pt:가} 처럼 조사를 붙이면 받침에 맞춰 자동으로 이/가, 을/를, 은/는… 을 골라 줌
  const JOSA = { 가: ['이', '가'], 는: ['은', '는'], 를: ['을', '를'], 와: ['과', '와'], 야: ['아', '야'], 랑: ['이랑', '랑'], 예요: ['이에요', '예요'], 로: ['으로', '로'] };
  const batchim = s => { const c = s.charCodeAt(s.length - 1); return c >= 0xAC00 && c <= 0xD7A3 ? (c - 0xAC00) % 28 : 0; };
  const josa = (name, j) => {
    const p = JOSA[j]; if (!p || !name) return name + (j || '');
    const b = batchim(name);
    if (j === '로' && b === 8) return name + '로';   // ㄹ 받침은 '로'
    return name + (b ? p[0] : p[1]);
  };
  const fmt = v => String(val(v) ?? '').replace(/\{(\w+)(?::([가-힣]+))?\}/g, (m, k, j) => {
    const id = k === 'inf' ? G.flags.first_infected : k === 'dead' ? G.flags.last_dead : G.flags[k];
    const nm = nameOf(id) || '';
    return j ? josa(nm, j) : nm;
  });

  function resolveCast(c) {
    let list = val(c);
    if (list === 'all') list = present();
    return (list || []).filter(Boolean).map(tok => {
      const [id, mod] = String(tok).split(':');
      return { id, zombie: mod === 'zombie', dusty: mod === 'dusty' || (id === 'dante' && G.flags.dante_dusty) };
    }).filter(e => CHARS[e.id] && (G.alive[e.id] || e.zombie));
  }

  /* ================= 렌더링 ================= */
  function castLayout(n) {
    const pos = [];
    if (n <= 9) { const sp = 150 / Math.max(n, 1); for (let i = 0; i < n; i++) pos.push({ x: Math.round(5 + sp * (i + .5)), y: 116 }); }
    else {
      const back = Math.ceil(n / 2), front = n - back, sb = 150 / back, sf = 150 / front;
      for (let i = 0; i < back; i++) pos.push({ x: Math.round(5 + sb * (i + .5)), y: 107 });
      for (let i = 0; i < front; i++) pos.push({ x: Math.round(5 + sf * (i + .5) + sf * .25), y: 122 });
    }
    return pos;
  }

  function draw(ts) {
    const now = ts || performance.now();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    if (now < scene.shakeUntil) ctx.translate(Math.round((Math.random() - .5) * 5), Math.round((Math.random() - .5) * 3));
    const env = G ? G.env : { lights: true, sky: 'day', time: 'night' };
    (ART.bg[scene.bg] || ART.bg.office)(ctx, env, now, G);

    let mark = null;
    if (scene.bg !== 'cctv' && G) {
      const cast = scene.cast.length > 20 ? scene.cast.slice(0, 20) : scene.cast;
      const pos = castLayout(cast.length), frame = Math.floor(now / 120);
      cast.forEach((e, i) => {
        const p = pos[i], d = CHARS[e.id], bob = Math.floor(now / 520 + i * .7) % 2, talking = scene.speaker === e.id;
        ART.drawChar(ctx, d, p.x, p.y, { bob, talk: talking && typing, frame: frame + i, zombie: e.zombie, dusty: e.dusty });
        if (talking) mark = { d, x: p.x, y: p.y, bob };
      });
      scene.runners = scene.runners.filter(r => r.x(now) < W + 12);
      scene.runners.forEach(r => ART.drawChar(ctx, r.d, r.x(now), r.y, { walk: true, frame: Math.floor(now / 90) + r.k }));
    }
    if (G && scene.bg !== 'cctv') {
      let dk = (G.day - 1) * .016 + (env.time === 'night' ? .34 : 0) + (!env.lights ? .18 : 0);
      if (env.sky === 'dawn') dk *= .4;
      dk = Math.min(dk, .72);
      if (dk > 0) { ctx.fillStyle = `rgba(6,8,22,${dk})`; ctx.fillRect(-5, -5, W + 10, H + 10); }
      if (env.emergency && !env.lights) {
        ctx.fillStyle = `rgba(255,30,40,${.05 + .045 * Math.sin(now / 380)})`; ctx.fillRect(-5, -5, W + 10, H + 10);
      }
    }
    if (mark) ART.drawMark(ctx, mark.d, mark.x, mark.y, mark.bob, now);

    scene.fx = scene.fx.filter(f => now - f.t0 < f.dur);
    for (const f of scene.fx) {
      const k = (now - f.t0) / f.dur;
      if (f.type === 'flash') { ctx.fillStyle = `rgba(255,255,245,${k < .18 ? 1 : 1 - (k - .18) / .82})`; ctx.fillRect(-5, -5, W + 10, H + 10); }
      if (f.type === 'alarm') { ctx.fillStyle = `rgba(255,20,30,${.12 + .14 * (Math.sin(now / 110) * .5 + .5)})`; ctx.fillRect(-5, -5, W + 10, H + 10); }
      if (f.type === 'hit') { ctx.fillStyle = `rgba(200,0,20,${(1 - k) * .6})`; ctx.fillRect(-5, -5, W + 10, H + 10); }
      if (f.type === 'fade') { ctx.fillStyle = `rgba(0,0,0,${Math.sin(k * Math.PI)})`; ctx.fillRect(-5, -5, W + 10, H + 10); }
      if (f.type === 'static') {
        for (let i = 0; i < 500; i++) { const g = (Math.random() * 255) | 0; ctx.fillStyle = `rgb(${g},${g},${g})`; ctx.fillRect((Math.random() * W) | 0, (Math.random() * H) | 0, 2, 1); }
      }
    }
    requestAnimationFrame(draw);
  }

  function spawnRunners(n) {
    const styles = ['short', 'long', 'bob', 'slick', 'buzz', 'side', 'pony', 'curly'];
    const depts = ['sales', 'biz', 'dev', 'sup', 'exec', 'sales', 'biz', 'dev'];
    const hairs = ['#1d1a18', '#3b2a1d', '#6b3a22', '#2a2a2a', '#8a5a3a', '#111'];
    const t0 = performance.now();
    for (let i = 0; i < n; i++) {
      const x0 = 8 + Math.random() * 110, v = .06 + Math.random() * .05, delay = Math.random() * 1100;
      scene.runners.push({
        d: { dept: depts[i % depts.length], style: styles[i % styles.length], hair: hairs[i % hairs.length], short: i % 5 === 0 },
        y: Math.random() < .5 ? 107 : 122, k: i,
        x: now => x0 + Math.max(0, now - t0 - delay) * v,
      });
    }
  }

  /* ================= HUD ================= */
  function buildHUD() {
    $('#stats').innerHTML = STATS.map(s =>
      `<div class="stat" data-k="${s.k}" style="--c:${s.color}"><div class="lab">${s.label}<b class="val">0</b></div><div class="bar">${'<i></i>'.repeat(10)}</div></div>`).join('');
  }
  function renderHUD(changed) {
    if (!G) return;
    $('#dayLabel').textContent = 'DAY ' + String(G.day).padStart(2, '0');
    $('#aliveLabel').textContent = headLabel();
    STATS.forEach(s => {
      const cell = document.querySelector(`.stat[data-k="${s.k}"]`), v = Math.round(G.stats[s.k]);
      cell.querySelector('.val').textContent = v;
      cell.querySelectorAll('.bar i').forEach((el, i) => el.classList.toggle('on', i < Math.ceil(v / 10)));
      cell.classList.toggle('danger', s.bad ? v >= 70 : v <= 25);
      if (changed && changed[s.k]) {
        cell.classList.remove('up', 'down'); void cell.offsetWidth;
        cell.classList.add((s.bad ? changed[s.k] < 0 : changed[s.k] > 0) ? 'up' : 'down');
      }
    });
  }

  /* ================= 상태 변경 ================= */
  function applyEffects(eff) {
    const e = val(eff); if (!e) return;
    for (const k in e) if (k in G.stats) G.stats[k] = clamp(G.stats[k] + e[k], 0, 100);
    renderHUD(e);
  }
  function applyTrust(tr) {
    const t = val(tr); if (!t) return;
    for (const k in t) {
      if (k === 'all') CORE.forEach(id => { G.trust[id] = clamp(G.trust[id] + t.all, 0, 10); });
      else if (k in G.trust) G.trust[k] = clamp(G.trust[k] + t[k], 0, 10);
    }
  }
  function kindOf(cause) {
    const c = cause || '';
    if (/변이|감염/.test(c)) return 'zombie';
    if (/피폭|낙진/.test(c)) return 'rad';
    if (/화재|불/.test(c)) return 'fire';
    if (/미귀환|행방|실종/.test(c)) return 'missing';
    if (/이탈|떠남/.test(c)) return 'gone';
    if (/굶주/.test(c)) return 'starve';
    if (/습격|밤/.test(c)) return 'night';
    if (/충돌|무력|싸움|폭행/.test(c)) return 'fight';
    if (/희생|미끼/.test(c)) return 'sacrifice';
    if (/작별|보내|조용히/.test(c)) return 'farewell';
    return 'bite';
  }
  function killChar(id, cause, kind, last) {
    id = val(id);
    if (id === 'dante_outside') id = 'dante';
    if (!id || !G.alive[id]) return;
    G.alive[id] = false;
    cause = cause || '사망';
    kind = kind || kindOf(cause);
    G.deathsLog.push({ id, day: G.day, cause });
    G.pending.push({ id, cause, kind, last: fmt(last) || LAST_WORDS[kind][Math.floor(Math.random() * LAST_WORDS[kind].length)] });
    G.flags.last_dead = id;
    G.hidden = G.hidden.filter(x => x !== id);
    scene.cast = scene.cast.filter(e => e.id !== id);
    G.stats.morale = clamp(G.stats.morale - 2, 0, 100);
    renderHUD({ morale: -2 });
  }
  function setHidden(id, on) {
    id = val(id); if (!id) return;
    G.hidden = G.hidden.filter(x => x !== id);
    if (on) G.hidden.push(id);
  }
  function join(ids) {
    (val(ids) || []).forEach(id => {
      if (!CHARS[id] || !G.alive[id]) return;
      if (!isCore(id) && !G.joined.includes(id)) G.joined.push(id);
      if (!isCore(id) && !G.met.includes(id)) G.met.push(id);
    });
  }
  function leave(ids) {
    const l = [].concat(val(ids) || []);
    G.joined = G.joined.filter(id => !l.includes(id));
    scene.cast = scene.cast.filter(e => !l.includes(e.id));
  }

  /* ================= 사망자의 최후 화면 ================= */
  let deathRAF = 0;
  async function flushDeaths() {
    while (G.pending && G.pending.length) {
      const d = G.pending.shift();
      await showDeath(d);
    }
  }
  async function showDeath(d) {
    const c = CHARS[d.id], el = $('#death');
    SFX.death();
    el.innerHTML = `<div class="d-wrap">
      <div class="d-eyebrow">DAY ${dd(G.day)} · 최후</div>
      <canvas width="${ART.DW}" height="${ART.DH}"></canvas>
      <div class="d-name" style="--c:${(DEPTS[c.dept] || DEPTS.exec).color}">${c.name}</div>
      <div class="d-role">${c.role}</div>
      <div class="d-cause">☠ ${d.cause}</div>
      ${d.last ? `<div class="d-last">“${d.last}”</div>` : ''}
      <div class="d-tap">탭하여 계속</div></div>`;
    el.hidden = false;
    const dc = el.querySelector('canvas').getContext('2d');
    const loop = t => { ART.deathArt(dc, c, d.kind, t); deathRAF = requestAnimationFrame(loop); };
    deathRAF = requestAnimationFrame(loop);
    await sleep(800);
    el.classList.add('ready');
    await waitTap();
    cancelAnimationFrame(deathRAF);
    el.classList.remove('ready');
    el.hidden = true; el.innerHTML = '';
  }

  /* ================= 입력 ================= */
  let tapHandler = null;
  function fireTap() { const h = tapHandler; if (h) { tapHandler = null; h(); } }
  document.addEventListener('pointerdown', e => {
    SFX.init();
    if (e.target.closest('button')) return;
    if (closeReview()) return;          // 이전 대사 보기 중이면 닫기만 하고 진행하지 않음
    if (e.target.closest('#mini')) return;
    fireTap();
  });
  document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); SFX.init(); if (closeReview()) return; fireTap(); }
    else if (/^[1-6]$/.test(e.key)) { const b = document.querySelectorAll('#choices button')[+e.key - 1]; if (b) b.click(); }
  });
  const waitTap = () => new Promise(r => { tapHandler = r; });
  function waitTapOr(ms) {
    return new Promise(r => {
      let done = false;
      const fin = () => { if (done) return; done = true; if (tapHandler === fin) tapHandler = null; r(); };
      tapHandler = fin; setTimeout(fin, ms);
    });
  }

  /* ================= 이전 대사 보기 =================
     바로 직전 대사 한 줄만 다시 볼 수 있어요. 선택지가 떠 있을 때는 버튼이 사라져요 */
  let shownLine = null, prevLine = null;
  const backBtn = $('#backBtn'), review = $('#review');
  function setBack(on) { backBtn.hidden = !(on && prevLine); }
  function openReview() {
    if (!prevLine) return;
    review.innerHTML = `<div class="rv-eyebrow">◀ 이전 대사</div>`
      + (prevLine.sp ? `<div class="rv-sp">${prevLine.sp}</div>` : '')
      + `<div class="rv-text ${prevLine.sp ? '' : 'narr'}">${prevLine.text}</div><div class="rv-tap">탭하면 돌아가요</div>`;
    review.hidden = false;
  }
  function closeReview() { if (review.hidden) return false; review.hidden = true; review.innerHTML = ''; return true; }
  backBtn.addEventListener('click', e => { e.stopPropagation(); SFX.init(); SFX.select(); review.hidden ? openReview() : closeReview(); });
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

  /* ================= 대화 ================= */
  const voiceOf = id => 300 + (([...id].reduce((a, ch) => a + ch.charCodeAt(0), 0) * 37) % 600);

  async function typeText(text, voice) {
    const el = $('#text'), next = $('#next');
    next.classList.remove('show');
    typing = true;
    let skip = false;
    const skipper = () => { skip = true; };
    tapHandler = skipper;
    for (let i = 1; i <= text.length; i++) {
      if (skip) { el.textContent = text; break; }
      el.textContent = text.slice(0, i);
      const ch = text[i - 1];
      if (voice && i % 2 === 0 && ch.trim()) SFX.blip(voice);
      await sleep(ch === '…' ? 110 : ch === ',' ? 70 : 26);
    }
    typing = false;
    if (tapHandler === skipper) tapHandler = null;
    next.classList.add('show');
    await waitTap();
    next.classList.remove('show');
  }

  async function speak(s) {
    let who = null;
    if (s.say) {
      who = val(s.say);
      if (!who || !CHARS[who] || !G.alive[who]) return;   // 이미 죽은 사람의 대사는 건너뜀
    }
    const c = who && CHARS[who];
    const text = fmt(s.say ? s.text : s.narr);
    if (!text) return;
    if (c && scene.bg !== 'cctv' && !G.hidden.includes(who) && !scene.cast.some(e => e.id === who)) {
      scene.cast.push({ id: who, dusty: who === 'dante' && G.flags.dante_dusty });
    }
    scene.speaker = c ? who : null;
    const box = $('#dialog'), sp = $('#speaker');
    $('#choices').innerHTML = '';
    box.className = 'box' + (c ? '' : ' narr');
    if (c) {
      sp.innerHTML = `<span class="nm" style="--c:${(DEPTS[c.dept] || DEPTS.exec).color}">${c.name}</span><span class="rl">${c.role}</span>`;
      sp.hidden = false;
    } else sp.hidden = true;
    prevLine = shownLine;
    shownLine = { sp: c ? sp.innerHTML : '', text: esc(text) };
    setBack(true);
    await typeText(text, c ? voiceOf(who) : 0);
  }

  function presentChoice(prompt, opts) {
    return new Promise(res => {
      scene.speaker = null;
      closeReview(); setBack(false);   // 선택지에서는 되돌리기 불가
      $('#dialog').className = 'box prompt';
      $('#speaker').hidden = true;
      $('#text').textContent = prompt;
      $('#next').classList.remove('show');
      const wrap = $('#choices'); wrap.innerHTML = '';
      opts.forEach((o, i) => {
        const b = document.createElement('button');
        b.className = 'choice';
        b.innerHTML = `<span class="n">${i + 1}</span><span class="t">${fmt(o.label)}${o.hint ? `<span class="h">${fmt(o.hint)}</span>` : ''}</span>`;
        b.onclick = () => { SFX.init(); SFX.select(); wrap.innerHTML = ''; res(o); };
        wrap.appendChild(b);
      });
    });
  }

  async function runChoice(ch) {
    ch = val(ch);
    const opts = (val(ch.options) || []).filter(o => !o.when || o.when(G));
    if (!opts.length) return;
    const opt = await presentChoice(fmt(ch.prompt), opts);
    let out = opt;
    if (opt.branch) out = Object.assign({ label: opt.label }, opt.outcomes[opt.branch(G)]);
    const before = { ...G.stats }, d0 = G.deathsLog.length, tr0 = JSON.stringify(G.trust);
    if (out.set) Object.assign(G.flags, val(out.set));
    if (out.do) out.do(G);
    applyEffects(out.effects);
    applyTrust(out.trust);
    if (out.join) join(out.join);
    if (out.then) await runSteps(out.then);
    if (out.kill) (val(out.kill) || []).forEach(id => killChar(id, out.cause));
    await flushDeaths();
    if (out.tag) {
      await showResult(out, before, G.deathsLog.slice(d0), tr0 !== JSON.stringify(G.trust));
      G.log.push({ day: G.day, q: fmt(ch.prompt), a: fmt(opt.label), tag: out.tag });
    }
  }

  async function showResult(out, before, deaths, trustChanged) {
    const T = TAGS[out.tag];
    SFX[T.sfx]();
    scene.speaker = null;
    const deltas = STATS.map(s => {
      const d = Math.round(G.stats[s.k] - before[s.k]); if (!d) return '';
      const good = s.bad ? d < 0 : d > 0;
      return `<span class="${good ? 'up' : 'down'}">${s.label} ${d > 0 ? '+' : ''}${d}</span>`;
    }).join('');
    const dl = deaths.map(d => `<div class="r-dead">☠ ${CHARS[d.id].name} — ${d.cause}</div>`).join('');
    $('#dialog').className = 'box result tag-' + out.tag;
    $('#speaker').hidden = true;
    $('#choices').innerHTML = '';
    $('#text').innerHTML = `<div class="r-head">${T.icon} ${T.label}</div>`
      + (out.note ? `<div class="r-note">${fmt(out.note)}</div>` : '')
      + (deltas ? `<div class="r-deltas">${deltas}</div>` : '') + dl
      + (trustChanged ? '<div class="r-mem">누군가 이 선택을 기억합니다</div>' : '');
    $('#next').classList.add('show');
    await waitTap();
    $('#next').classList.remove('show');
  }

  async function showToast(t) {
    const o = typeof t === 'string' ? { from: '사내메신저', text: t } : t;
    const el = $('#toast');
    el.querySelector('b').textContent = fmt(o.from || '사내메신저');
    el.querySelector('span').textContent = fmt(o.text);
    el.className = 'toast show' + (o.alert ? ' alert' : '') + (o.unlock ? ' unlock' : '');
    o.alert ? SFX.beep() : SFX.toast();
    await waitTapOr(o.ms || 2600);
    el.className = 'toast';
    await sleep(200);
  }

  async function playFx(type, dur) {
    const t0 = performance.now();
    const push = d => scene.fx.push({ type, t0, dur: d });
    switch (type) {
      case 'flash':  SFX.boom(); push(dur || 1500); await sleep((dur || 1500) * .7); break;
      case 'shake':  scene.shakeUntil = t0 + (dur || 700); await sleep(dur || 700); break;
      case 'alarm':  SFX.alarm((dur || 1800) / 1000); push(dur || 1800); await sleep(dur || 1800); break;
      case 'static': SFX.static(); push(dur || 900); await sleep(dur || 900); break;
      case 'hit':    SFX.thud(); push(dur || 500); scene.shakeUntil = t0 + 300; await sleep(dur || 500); break;
      case 'fade':   push(dur || 1200); await sleep((dur || 1200) / 2); break;
      case 'exodus': spawnRunners(16); SFX.door(); await sleep(dur || 2800); break;
    }
  }

  /* ================= 스텝 실행기 ================= */
  async function runSteps(steps) {
    for (const s of val(steps) || []) { if (G.over) return; await runStep(s); }
  }
  async function runStep(s) {
    if (!s) return;
    if (typeof s === 'function') { const r = s(G); if (Array.isArray(r)) await runSteps(r); return; }
    if (s.when && !s.when(G)) return;
    if (s.do) s.do(G);
    if (s.set) Object.assign(G.flags, val(s.set));
    if (s.env) Object.assign(G.env, val(s.env));
    if (s.join) join(s.join);
    if (s.leave) leave(s.leave);
    if (s.hide) setHidden(s.hide, true);
    if (s.unhide) setHidden(s.unhide, false);
    if (s.bg) scene.bg = s.bg;
    if (s.cast !== undefined) scene.cast = resolveCast(s.cast);
    if (s.effects) applyEffects(s.effects);
    if (s.trust) applyTrust(s.trust);
    if (s.kill) { [].concat(val(s.kill)).forEach(id => killChar(id, s.cause, s.kind, s.last)); }
    if (s.sfx && SFX[s.sfx]) SFX[s.sfx]();
    if (s.bgm !== undefined) SFX.bgm(s.bgm);
    if (s.fx) await playFx(s.fx, s.dur);
    await flushDeaths();
    if (s.toast) await showToast(s.toast);
    if (s.say || s.narr) await speak(s);
    if (s.choice) await runChoice(s.choice);
    if (s.result) {   // 선택 없이 판정 결과만 보여줄 때 (예: Day 14 반란)
      const r = val(s.result), before = { ...G.stats }, d0 = G.deathsLog.length, tr0 = JSON.stringify(G.trust);
      if (r.set) Object.assign(G.flags, val(r.set));
      applyEffects(r.effects); applyTrust(r.trust);
      if (r.then) await runSteps(r.then);
      await flushDeaths();
      await showResult(r, before, G.deathsLog.slice(d0), tr0 !== JSON.stringify(G.trust));
      if (r.log) G.log.push({ day: G.day, q: fmt(r.log), a: fmt(r.note || ''), tag: r.tag });
    }
    if (s.mini) await runMini(s.mini);
    if (s.if) await runSteps(s.if(G) ? s.then : s.else);
    if (s.wait) await sleep(s.wait);
    renderHUD();
  }

  /* ================= 미니게임 =================
     js/minigames.js 의 MINI[type](G) 가 { dead:[{id,cause,kind,last}], effects, note } 를 돌려줌 */
  async function runMini(type) {
    closeReview(); setBack(false);
    $('#choices').innerHTML = '';
    const before = { ...G.stats }, d0 = G.deathsLog.length;
    const prevBgm = G.env.time === 'night' ? 'night' : 'tense';
    SFX.bgm('tense');
    const res = await MINI[type](G);
    applyEffects(res.effects);
    if (res.trust) applyTrust(res.trust);
    if (res.join) join(res.join);
    if (res.saved) G.flags.zed_saved = true;
    // 좀비가 되어 돌아온 '흩어진 동료' — 사망 화면 없이 명단에만 기록
    (res.zombified || []).forEach(id => { if (G.alive[id]) { G.alive[id] = false; (G.zlog = G.zlog || {})[id] = `좀비가 되어 돌아옴 (D${G.day})`; } });
    (res.dead || []).forEach(d => killChar(d.id, d.cause, d.kind, d.last));
    await flushDeaths();
    SFX.bgm(prevBgm);
    const dead = G.deathsLog.slice(d0);
    await showResult({ tag: dead.length ? 'death' : 'gain', note: res.note }, before, dead, false);
    G.log.push({ day: G.day, q: res.log || '미니게임', a: res.note || '', tag: dead.length ? 'death' : 'gain' });
  }

  /* ================= 밤의 위기 =================
     예전엔 밤마다 확률로 누군가 죽었지만, 이제는 수치가 위험선에 닿으면 '위기 선택지'가 떠요
     죽음은 플레이어가 그 선택을 했을 때만 일어나요 */
  const lowestTrust = (ex = []) => present().filter(i => i !== 'rick' && !ex.includes(i)).sort((a, b) => G.trust[a] - G.trust[b])[0];
  const firstAlive = (ids, ex = []) => ids.find(i => G.alive[i] && present().includes(i) && !ex.includes(i));
  function crises(onlyFood) {
    const list = [];
    const nz = G.stats.noise + (G.flags.defense_weak ? 15 : 0) - (G.flags.barricade ? 10 : 0);
    if (!onlyFood && nz >= 60) {
      const guard = firstAlive(['bill', 'ken', 'jaemin', 'chad', 'joel', 'zed', 'harvey']) || lowestTrust();
      if (guard) list.push({ id: guard, ch: {
        prompt: `밤 1시. 소음에 끌린 감염자들이 1층 유리문을 두드린다 (소음 ${Math.round(nz)})`,
        options: [
          { label: '식량 상자를 반대편 골목에 던져 유인한다', hint: '식량 -12', when: () => G.stats.food >= 12, tag: 'keep', effects: { food: -12, noise: -22 }, note: '감염자들이 상자를 따라 골목으로 몰려갔어요' },
          { label: '전원을 내리고 다 같이 숨죽인다', hint: '전력 -10 · 사기 -6', when: () => G.stats.power >= 10, tag: 'keep', effects: { power: -10, morale: -6, noise: -18 }, note: '새벽까지 아무도 숨을 크게 쉬지 않았어요' },
          { label: `${josa(nameOf(guard), '가')} 혼자 1층을 막는다`, hint: '희생이 따를 수 있어요', tag: 'death', effects: { noise: -25 }, kill: [guard], cause: '야간 습격 — 1층 방어', note: '문은 지켰어요' },
        ] } });
    }
    if (!onlyFood && G.stats.rad >= 70) {
      const sick = lowestTrust();
      if (sick) list.push({ id: sick, ch: {
        prompt: `${josa(nameOf(sick), '가')} 피를 토하며 쓰러졌다 (피폭 ${Math.round(G.stats.rad)})`,
        options: [
          { label: '아껴둔 약을 쓴다', hint: '약 1개 소모', when: () => (G.flags.medicine || 0) >= 1, tag: 'keep', do: g => { g.flags.medicine -= 1; }, effects: { rad: -8 }, note: `${josa(nameOf(sick), '가')} 고비를 넘겼어요` },
          { label: '공조를 강제로 최대 가동한다', hint: '전력 -15', when: () => G.stats.power >= 15, tag: 'keep', effects: { power: -15, rad: -15 }, note: '실내 공기가 조금 맑아졌어요' },
          { label: '회의실에 격리한다', tag: 'death', effects: { rad: -5 }, kill: [sick], cause: '피폭 후 변이', note: '회의실 문이 다시 잠겼어요' },
        ] } });
    }
    if (!onlyFood && G.stats.morale <= 10) {
      const l = lowestTrust();
      if (l) list.push({ id: l, ch: {
        prompt: `밤 3시. ${josa(nameOf(l), '가')} 몰래 짐을 싸고 있다 (사기 ${Math.round(G.stats.morale)})`,
        options: [
          { label: '비상 간식을 풀어 다 같이 먹는다', hint: '식량 -8', when: () => G.stats.food >= 8, tag: 'keep', effects: { food: -8, morale: 12 }, note: '오랜만에 다 같이 웃었어요' },
          { label: '진심으로 붙잡는다', hint: '신뢰가 4 이상이어야 해요', when: () => G.trust[l] >= 4, tag: 'keep', effects: { morale: 6 }, trust: { [l]: 1 }, note: `${josa(nameOf(l), '가')} 가방을 내려놓았어요` },
          { label: '보내준다', tag: 'death', effects: { morale: 2 }, kill: [l], cause: '밤사이 떠남', note: '아침에 책상 하나가 비어 있었어요' },
        ] } });
    }
    if (G.stats.food <= 0) {
      const w = lowestTrust();
      if (w) list.push({ id: w, ch: {
        prompt: '식량이 바닥났다. 오늘 밤 먹을 게 없다',
        options: [
          { label: '마지막 전력으로 지하 냉동고를 연다', hint: '전력 -20', when: () => G.stats.power >= 20, tag: 'keep', effects: { power: -20, food: 12 }, note: '냉동 만두 한 박스를 찾았어요' },
          { label: '다 같이 굶는다', hint: '사기 -12', tag: 'keep', effects: { morale: -12 }, note: '배고픈 밤이 길었어요' },
          { label: `${nameOf(w)}의 몫을 줄인다`, tag: 'death', effects: { food: 6 }, kill: [w], cause: '굶주림', note: '아무도 그 얘기를 다시 꺼내지 않았어요' },
        ] } });
    }
    return list;
  }
  async function nightCrises(onlyFood) {
    const list = crises(onlyFood);
    if (!list.length) return [];
    const notes = [];
    G.env.time = 'night'; scene.bg = 'office'; scene.cast = resolveCast('all');
    SFX.bgm('night');
    for (const c of list) {
      if (!G.alive[c.id]) continue;
      const d0 = G.deathsLog.length;
      await runChoice(c.ch);
      notes.push(G.deathsLog.length > d0 ? `밤의 위기 — ${josa(nameOf(c.id), '를')} 잃었어요` : '밤의 위기를 넘겼어요');
    }
    return notes;
  }

  /* ================= 오버레이 화면 ================= */
  function overlay(html, cls = '') {
    const ov = $('#overlay');
    ov.className = cls; ov.innerHTML = html; ov.hidden = false;
    return ov;
  }
  function closeOverlay() { const ov = $('#overlay'); ov.hidden = true; ov.innerHTML = ''; ov.className = ''; }
  function waitButton(ov, sel = '.btn') {
    return new Promise(res => ov.querySelectorAll(sel).forEach(b => b.addEventListener('click', () => { SFX.init(); SFX.select(); res(b.dataset.v); })));
  }
  const miniStats = () => `<div class="mini-stats">${STATS.map(s => `<div style="color:${s.color}">${s.label}<b>${Math.round(G.stats[s.k])}</b></div>`).join('')}</div>`;
  const dd = n => String(n).padStart(2, '0');

  async function briefing(D) {
    const key = D.key ? ' · ★ KEY DAY' : D.short ? ' · SHORT DAY' : D.talk ? ' · 대화의 날' : '';
    const ov = overlay(`<div class="card">
      <div class="eyebrow">DAY ${dd(D.day)}${key}</div>
      <h2>${D.title}</h2>
      <p class="quote">${fmt(D.preview)}</p>
      ${miniStats()}
      <div class="meta">${headLabel()} · 희생 ${G.deathsLog.length}명</div>
      <button class="btn">출근하기</button></div>`);
    await waitButton(ov);
    closeOverlay();
  }

  async function evening(D, notes) {
    const rows = STATS.map(s => {
      const a = Math.round(G.dayStart[s.k]), b = Math.round(G.stats[s.k]), d = b - a;
      const cls = d === 0 ? '' : ((s.bad ? d < 0 : d > 0) ? 'up' : 'down');
      return `<div class="ev-row"><span style="color:${s.color}">${s.label}</span><span>${a} → <b>${b}</b></span><span class="${cls}">${d > 0 ? '+' : ''}${d}</span></div>`;
    }).join('');
    const deaths = G.deathsLog.slice(G.dayDeath0);
    const ov = overlay(`<div class="card">
      <div class="eyebrow">DAY ${dd(D.day)} · 저녁 결산</div>
      <h2>${D.title}</h2>
      ${rows}
      <div class="ev-notes">${notes.map(n => `<div>${n}</div>`).join('')}</div>
      ${deaths.length ? `<div class="ev-dead">${deaths.map(d => `☠ ${CHARS[d.id].name} — ${d.cause}`).join('<br>')}</div>` : ''}
      <p class="quote" style="margin-top:14px">${fmt(D.teaser)}</p>
      <div class="meta">생존 ${survivors().length}명</div>
      <button class="btn">퇴근… 은 못 하고 다음 날로</button></div>`);
    await waitButton(ov);
    closeOverlay();
  }

  async function upkeep(D) {
    const notes = [];
    const mouths = survivors().length;
    let cons = Math.ceil(mouths * .26);
    if (G.flags.ration_extreme) cons = Math.ceil(cons * .4);
    else if (G.flags.ration_system) cons = Math.ceil(cons * .6);
    if (G.flags.joel_ops && G.alive.joel) cons = Math.max(1, cons - 1);
    const day = G.day;
    const radD = day <= 10 ? (G.flags.air_off ? 4 : 1) : day <= 18 ? (G.flags.air_off ? 1 : -2) : -4;
    const eff = { food: -cons, power: G.env.lights ? -4 : -2, rad: radD, noise: -4, morale: -1 };
    notes.push(`${mouths}명이 하루를 버티며 식량 ${cons}을 썼어요`);
    if (G.flags.ration_extreme) notes.push('비축 모드로 하루 한 끼만 먹었어요');
    else if (G.flags.ration_system) notes.push('배급제로 소모가 줄었어요');
    if (G.flags.air_off) notes.push('공조가 멈춰 실내 피폭이 올라요');
    if (G.flags.infected_inside) { eff.noise += 5; notes.push('회의실에서 긁는 소리가 밤새 새어 나와요'); }
    if (day === 11) notes.push('낙진이 조금씩 가라앉기 시작했어요');
    for (const k in eff) G.stats[k] = clamp(G.stats[k] + eff[k], 0, 100);
    renderHUD(eff);

    // ---- 밤의 위기: 수치가 위험선이면 선택지로 결정 (무작위 사망 없음) ----
    if (!D.safeNight && day >= 5) notes.push(...await nightCrises());
    else if (G.stats.food <= 0) notes.push(...await nightCrises(true));
    if (G.stats.power <= 0 && G.env.lights) { G.env.lights = false; notes.push('전력이 끊겼어요'); }
    if (G.stats.power <= 0 && !G.flags.air_off) { G.flags.air_off = true; notes.push('전력이 바닥나 공조가 멈췄어요'); }
    renderHUD();
    await flushDeaths();
    return notes;
  }

  /* ================= 엔딩 ================= */
  function badCheck() { return G.stats.rad >= 100 || survivors().filter(id => id !== 'rick').length < 3; }

  /* 엔딩 컷신: 장면(shot)마다 릭의 독백이 한 줄씩 나옴. ['r','대사']=릭, ['n','지문']=내레이션 */
  async function playCine(n, shots) {
    const el = $('#cine');
    el.hidden = false;
    for (const shot of shots) {
      el.innerHTML = `<div class="c-wrap"><div class="c-eyebrow">ENDING ${n}</div><canvas width="${ART.CW}" height="${ART.CH}"></canvas>
        <div class="c-line"><div class="c-who"></div><div class="c-text"></div></div><div class="d-tap">탭하여 계속</div></div>`;
      const cx = el.querySelector('canvas').getContext('2d'), t0 = performance.now();
      let raf = 0;
      const loop = now => { cx.imageSmoothingEnabled = false; cx.clearRect(0, 0, ART.CW, ART.CH); (ART.cine[shot.s] || (() => {}))(cx, now - t0, G); raf = requestAnimationFrame(loop); };
      raf = requestAnimationFrame(loop);
      if (shot.sfx && SFX[shot.sfx]) SFX[shot.sfx]();
      await sleep(500);
      for (const [who, raw] of shot.lines) {
        const line = fmt(raw), w = el.querySelector('.c-who'), tx = el.querySelector('.c-text');
        w.textContent = who === 'r' ? '릭' : who === 'z' ? '릭…?' : '';
        el.querySelector('.c-line').className = 'c-line ' + (who === 'n' ? 'narr' : who === 'z' ? 'zomb' : '');
        el.classList.remove('ready');
        let skip = false; tapHandler = () => { skip = true; };
        for (let i = 1; i <= line.length; i++) {
          if (skip) { tx.textContent = line; break; }
          tx.textContent = line.slice(0, i);
          if (who !== 'n' && i % 2 === 0) SFX.blip(who === 'z' ? 160 : 420);
          await sleep(line[i - 1] === '…' ? 140 : 38);
        }
        tapHandler = null;
        el.classList.add('ready');
        await waitTap();
      }
      cancelAnimationFrame(raf);
    }
    el.hidden = true; el.innerHTML = '';
  }

  /* 엔딩 크레딧: 생존자 한 명씩 후일담이 아래에서 위로 올라감. 탭하면 넘김 */
  async function playCredits(n) {
    const kind = n === 1 || n === 3 ? 'out' : n === 2 ? 'stay' : 'alone';
    const EP = STORY.epilogue || {}, DEF = (STORY.epilogueDefault || {})[kind] || [''];
    const surv = survivors();
    const ordered = [...surv.filter(id => id === 'rick'), ...surv.filter(id => id !== 'rick')];
    const line = (id, i) => { const e = EP[id]; return fmt(e ? val(e[kind]) : DEF[i % DEF.length]); };
    const fallen = G.deathsLog.map(d => d.id);
    const el = $('#cine');
    el.innerHTML = `<div class="cr-wrap"><div class="cr-roll">
        <div class="cr-title">ENDING ${n}<br><b>${STORY.endings[n].title}</b></div>
        <div class="cr-sec">살아남은 사람들</div>
        ${ordered.map((id, i) => `<div class="cr-row"><canvas data-id="${id}" width="16" height="22"></canvas><div>
          <div class="cr-nm" style="--c:${(DEPTS[CHARS[id].dept] || DEPTS.exec).color}">${CHARS[id].name}<span>${CHARS[id].role}</span></div>
          <div class="cr-ln">${line(id, i)}</div></div></div>`).join('') || '<div class="cr-ln">아무도 남지 않았다</div>'}
        ${fallen.length ? `<div class="cr-sec">기억할 이름</div><div class="cr-fallen">${fallen.map(id => CHARS[id].name).join(' · ')}</div>` : ''}
        <div class="cr-end">지구종말에도 출근합니다<br><span>THANK YOU FOR CLOCKING IN</span></div>
      </div></div><div class="d-tap">탭하면 넘어가요</div>`;
    el.hidden = false; el.classList.add('ready', 'credits');
    el.querySelectorAll('canvas').forEach(c => { const x = c.getContext('2d'); x.imageSmoothingEnabled = false; ART.drawChar(x, CHARS[c.dataset.id], 8, 20, { frame: 0 }); });
    const roll = el.querySelector('.cr-roll'), box = el.querySelector('.cr-wrap');
    const dist = roll.offsetHeight + box.offsetHeight;
    const dur = Math.max(9000, dist * 28);
    roll.style.transform = `translateY(${box.offsetHeight}px)`;
    const t0 = performance.now();
    let raf = 0;
    const step = now => { const k = Math.min(1, (now - t0) / dur); roll.style.transform = `translateY(${box.offsetHeight - dist * k}px)`; if (k < 1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
    await waitTapOr(dur + 600);
    cancelAnimationFrame(raf);
    el.classList.remove('ready', 'credits'); el.hidden = true; el.innerHTML = '';
  }

  async function showEnding(n) {
    G.over = true; clearSave();
    const E = STORY.endings[n];
    SFX.bgm(E.bgm || 'night');
    if (E.cine) await playCine(n, val(E.cine));
    await playCredits(n);
    if (E.env) Object.assign(G.env, E.env);
    scene.bg = E.bg || 'office'; scene.cast = resolveCast(E.cast || 'all'); scene.speaker = null;
    $('#choices').innerHTML = ''; $('#dialog').className = 'box narr'; $('#speaker').hidden = true; $('#text').textContent = '';
    SFX.bgm(E.bgm || 'night');
    n === 6 ? SFX.death() : SFX.gain();
    const surv = survivors().map(id => CHARS[id].name).join(', ') || '없음';
    const log = G.log.map(l => `<div><em>Day ${l.day} · ${l.q}</em><br>${TAGS[l.tag].icon} ${l.a}</div>`).join('');
    const ov = overlay(`<div class="card">
      <div class="eyebrow ${n === 6 || n === 4 ? 'red' : ''}">ENDING ${n} / 6</div>
      <h2>${E.title}</h2>
      ${(val(E.text) || []).map(p => `<p>${fmt(p)}</p>`).join('')}
      ${E.quote ? `<p class="quote">${fmt(E.quote)}</p>` : ''}
      ${miniStats()}
      <p><b>생존 ${survivors().length}명</b> — ${surv}</p>
      <p style="color:#ff8a95">희생 ${G.deathsLog.length}명 — ${G.deathsLog.map(d => `${CHARS[d.id].name}(D${d.day})`).join(', ') || '없음'}</p>
      <details class="log"><summary>내가 내린 결정 ${G.log.length}개 보기</summary>${log}</details>
      <button class="btn">${E.restart || '처음부터 다시 출근'}</button></div>`);
    await waitButton(ov);
    location.reload();
  }

  function showRoster() {
    if (!G) return;
    const status = id => {
      if (!G.alive[id]) { const d = G.deathsLog.find(x => x.id === id); return ['dead', `☠ ${d ? d.cause : (G.zlog && G.zlog[id]) || '사망'}`]; }
      if (!isCore(id) && !G.met.includes(id)) return ['lost', '행방불명'];
      if (!isCore(id) && !G.joined.includes(id)) return ['hid', '다시 떠남'];
      if (G.hidden.includes(id)) return ['hid', '격리 중'];
      return ['', isCore(id) ? '생존' : '귀환 · 생존'];
    };
    const fled = Object.keys(CHARS).filter(id => CHARS[id].npc && CHARS[id].dept !== 'out');
    const outs = Object.keys(CHARS).filter(id => CHARS[id].dept === 'out' && G.met.includes(id));
    const cell = id => { const [cls, st] = status(id), c = CHARS[id];
      return `<div class="rc ${cls}"><canvas data-id="${id}" width="16" height="22"></canvas>${c.name}<div class="rr">${c.role}</div><div class="st">${st}</div></div>`; };
    const back = fled.filter(id => G.met.includes(id)).length;
    const ov = overlay(`<div class="card">
      <div class="eyebrow">사원 명단 · 전체 ${CORE.length + fled.length}명 · 생존 ${survivors().length}명</div>
      <div class="r-sec">사무실에 남은 사람 <b>${CORE.length}명</b></div>
      <div class="roster">${CORE.map(cell).join('')}</div>
      <div class="r-sec">Day 1에 흩어진 사람 <b>${fled.length}명</b> <span>귀환 ${back} · 행방불명 ${fled.length - back}</span></div>
      <div class="roster">${fled.map(cell).join('')}</div>
      ${outs.length ? `<div class="r-sec">외부인</div><div class="roster">${outs.map(cell).join('')}</div>` : ''}
      <button class="btn ghost">닫기</button></div>`);
    ov.querySelectorAll('canvas').forEach(c => {
      const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
      ART.drawChar(x, CHARS[c.dataset.id], 8, 20, { frame: 0, dusty: c.dataset.id === 'dante' && G.flags.dante_dusty });
    });
    waitButton(ov).then(closeOverlay);
  }

  /* ================= 저장 ================= */
  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) {} }
  function loadSave() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

  /* ================= 하루 진행 ================= */
  async function playDay(n) {
    const D = STORY.days.find(d => d.day === n);
    if (!D) return showEnding(STORY.decideEnding(G));
    G.day = n;
    if (D.env) Object.assign(G.env, val(D.env));
    G.pending = [];
    save();
    G.dayStart = { ...G.stats }; G.dayDeath0 = G.deathsLog.length;
    $('#dayTitle').textContent = D.title;
    scene.bg = D.bg || 'office'; scene.cast = resolveCast('all'); scene.speaker = null;
    $('#dialog').className = 'box narr'; $('#speaker').hidden = true; $('#text').textContent = ''; $('#choices').innerHTML = '';
    renderHUD();
    SFX.bgm(D.bgm || (G.env.time === 'night' ? 'night' : 'tense'));
    await briefing(D);
    await runSteps(D.steps);
    await flushDeaths();
    if (G.over) return;
    if (G.flags.ending) return showEnding(G.flags.ending);
    const notes = await upkeep(D);
    if (badCheck()) return showEnding(6);
    await evening(D, notes);
    playDay(n + 1);
  }

  async function title() {
    G = freshState();
    G.env = { lights: true, sky: 'day', time: 'night', emergency: false };
    scene.bg = 'office'; scene.cast = resolveCast(['rick', 'phil', 'rose', 'ryan', 'jena', 'luka']);
    renderHUD();
    SFX.bgm('calm');
    const saved = loadSave();
    const ov = overlay(`<div class="t-center">
        <div class="eyebrow">CLOCK IN AT THE END OF THE WORLD</div>
        <h1 class="t-title">지구종말에도<br>출근합니다</h1>
        <div class="sub">PIXEL SURVIVAL ADVENTURE · DAY 1–21</div>
      </div>
      <div class="t-bottom">
        <button class="btn" data-v="new">출근하기</button>
        ${saved ? `<button class="btn ghost" data-v="load">이어서 출근 (DAY ${dd(saved.day)})</button>` : ''}
        <div class="meta">화면을 탭하면 대사가 넘어가요 · 소리 켜짐</div>
      </div>`, 'title');
    const v = await waitButton(ov);
    closeOverlay();
    G = v === 'load' && saved ? saved : freshState();
    G.over = false;
    G.pending = G.pending || [];
    playDay(G.day);
  }

  /* ================= 시작 ================= */
  window.Game = { present, survivors, avgTrust, victim, nameOf, chance: p => Math.random() < p };
  buildHUD();
  $('#rosterBtn').addEventListener('click', showRoster);
  $('#soundBtn').addEventListener('click', e => { SFX.init(); e.target.textContent = SFX.toggle() ? '♪ ON' : '♪ OFF'; });
  setInterval(() => { if (G && G.stats.noise >= 45 && Math.random() < .4) SFX.growlFar(); }, 4000);
  requestAnimationFrame(draw);
  title();
})();
</script>
</body>
